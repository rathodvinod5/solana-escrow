[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = "allow"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
digest = "=0.10.7"
sha2 = "=0.10.8"
block-buffer = "=0.10.4"
crypto-common = "=0.1.6"

[patch.crates-io]
block-buffer = { git = "https://github.com/RustCrypto/utils", tag = "block-buffer-v0.10.4" }
# sha2   = { git = "https://github.com/RustCrypto/hashes", tag = "sha2-v0.10.8" }
# digest = { git = "https://github.com/RustCrypto/traits", tag = "digest-v0.10.7" }