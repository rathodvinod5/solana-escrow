[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
block-buffer = "=0.10.4"

[workspace.dependencies]
sha2 = " 0.10.8"
digest = "0.10.7"
