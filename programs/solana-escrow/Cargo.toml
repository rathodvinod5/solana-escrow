[package]
name = "solana-escrow"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# solana-program = "2.3.0"
# anchor-lang = "0.30.1"
# anchor-spl = "0.30.1"

# Explicit pins to prevent block-buffer 0.12.0 from sneaking in
